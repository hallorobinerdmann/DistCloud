<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DistCloud</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1b1f24; --mute:#4b5563; --acc:#2e9e5b; --warn:#d6452f; --glass:rgba(255,255,255,.55); --glass-line:rgba(255,255,255,.7); }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; font-family:Inter,system-ui,sans-serif; color:var(--ink); }
  #map { position:absolute; inset:0; }
  button { font:inherit; font-weight:600; border:0; cursor:pointer; }
  .glass { background:var(--glass); -webkit-backdrop-filter:blur(14px) saturate(1.4); backdrop-filter:blur(14px) saturate(1.4);
    border:1px solid var(--glass-line); box-shadow:0 4px 24px rgba(0,0,0,.10); }

  .brand { position:absolute; z-index:1000; top:calc(12px + env(safe-area-inset-top,0px)); left:12px; display:flex;
    align-items:center; gap:8px; background:rgba(255,255,255,.85); padding:7px 12px 7px 9px; border-radius:999px;
    box-shadow:0 2px 12px rgba(0,0,0,.14); font-weight:700; font-size:16px; letter-spacing:-.01em; }

  .chips { position:absolute; z-index:1000; top:calc(58px + env(safe-area-inset-top,0px)); left:12px; right:12px;
    display:flex; gap:6px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none; }
  .chips[hidden] { display:none; }
  .chips button { background:rgba(255,255,255,.85); color:var(--ink); box-shadow:0 2px 12px rgba(0,0,0,.14);
    border-radius:999px; padding:7px 12px; font-size:13px; white-space:nowrap; }
  .chips button.on { background:var(--ink); color:#fff; }

  .rail { position:absolute; z-index:1000; left:12px; top:50%; transform:translateY(-50%); width:220px;
    max-height:calc(100% - 220px); overflow-y:auto; padding:16px; border-radius:22px; }
  .sl { margin-bottom:14px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; }
  label { font-size:13px; font-weight:600; }
  .top b { font-size:20px; letter-spacing:-.02em; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:28px; background:transparent; margin:0; }
  input[type=range]::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:rgba(27,31,36,.18); }
  input[type=range]::-moz-range-track { height:6px; border-radius:3px; background:rgba(27,31,36,.18); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; margin-top:-9px; border-radius:50%;
    background:#fff; border:3px solid var(--acc); box-shadow:0 1px 4px rgba(0,0,0,.25); }
  input[type=range]::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:#fff; border:3px solid var(--acc); }

  .toggles { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .tg { display:inline-block; margin:0; }
  .tg input { position:absolute; opacity:0; pointer-events:none; }
  .tg span { display:inline-block; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.7); font-size:12px; font-weight:600; cursor:pointer; }
  .tg input:checked + span { background:var(--acc); color:#fff; }
  .tg input:focus-visible + span { outline:2px solid var(--ink); outline-offset:2px; }
  #pos { font-size:12px; color:var(--mute); margin-bottom:8px; }
  details { font-size:12px; }
  summary { cursor:pointer; color:var(--mute); }
  .rail input[type=password] { width:100%; margin-top:8px; padding:10px 12px; border:2px solid transparent; border-radius:12px;
    background:rgba(255,255,255,.7); font:inherit; outline:0; }
  .rail input[type=password]:focus { border-color:var(--acc); }

  #msg { position:absolute; z-index:1001; left:12px; right:60px; width:fit-content; max-width:calc(100% - 72px);
    bottom:calc(76px + env(safe-area-inset-bottom,0px)); padding:9px 12px; border-radius:14px; font-size:13px; }
  #msg:empty { display:none; }
  #msg.err { color:var(--warn); }

  .dock { position:absolute; z-index:1001; left:12px; right:60px; max-width:460px; bottom:calc(12px + env(safe-area-inset-bottom,0px));
    display:flex; align-items:center; gap:8px; padding:8px; border-radius:22px; }
  .dock input[type=text] { flex:1; min-width:0; padding:12px 14px; border:2px solid transparent; border-radius:14px;
    background:rgba(255,255,255,.7); font:inherit; color:inherit; outline:0; }
  .dock input[type=text]:focus { border-color:var(--acc); }
  .dock input[type=text].ok { background:rgba(230,244,236,.92); border-color:var(--acc); }
  .dock input[type=text].bad { background:rgba(251,233,230,.92); border-color:var(--warn); }
  .icon { flex:none; width:46px; height:46px; display:grid; place-items:center; border-radius:14px; background:rgba(255,255,255,.7); color:var(--ink); }
  .go { flex:none; height:46px; padding:0 16px; border-radius:14px; background:var(--acc); color:#fff; font-size:15px; }
  .go:disabled { opacity:.4; cursor:default; }

  .leaflet-popup-content a.nav { display:inline-block; margin-top:8px; background:var(--acc); color:#fff;
    padding:7px 12px; border-radius:8px; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div id="map"></div>
<div class="brand">
  <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
    <path d="M9 24a6 6 0 0 1-.6-11.97A8 8 0 0 1 23.7 10.6 6.7 6.7 0 0 1 23 24z" fill="#2e9e5b"/>
    <circle cx="16" cy="17" r="3.2" fill="#fff"/>
    <circle cx="16" cy="17" r="1.3" fill="#2e9e5b"/>
  </svg>
  <span>DistCloud</span>
</div>

<div id="chips" class="chips" hidden></div>

<div class="rail glass">
  <div class="sl">
    <div class="top"><label for="km">Reichweite</label><b id="kmv">100 km</b></div>
    <input id="km" type="range" min="0" max="120" value="100">
  </div>
  <div class="sl">
    <div class="top"><label for="buf">Puffer</label><b id="bufv">15 km</b></div>
    <input id="buf" type="range" min="0" max="40" value="15">
  </div>
  <div class="toggles">
    <label class="tg"><input id="ret" type="checkbox"><span>Hin und zurück</span></label>
    <label class="tg"><input id="chg" type="checkbox" checked><span>Schnelllader</span></label>
  </div>
  <div id="pos">Start: GPS-Knopf oder Karte antippen</div>
  <details id="keybox">
    <summary>API-Schlüssel</summary>
    <input id="key" type="password" placeholder="OpenRouteService-Schlüssel" autocomplete="off">
  </details>
</div>

<div id="msg" class="glass"></div>

<div class="dock glass">
  <input id="dest" type="text" placeholder="Ziel (optional)" autocomplete="off" oninput="this.className=''">
  <button id="gps" class="icon" aria-label="Mein Standort">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
  <button class="go" id="go" disabled>Berechnen</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const map = L.map('map', { zoomControl:false }).setView([51.16, 10.45], 6);
L.control.zoom({ position:'bottomright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'© OpenStreetMap-Mitwirkende'
}).addTo(map);

let start = null, marker = null, cloud = null;
try { $('key').value = localStorage.getItem('ors_key') || ''; } catch(e) {}
if (!$('key').value) $('keybox').open = true;

function setStart(latlng) {
  start = latlng;
  if (marker) marker.setLatLng(latlng); else marker = L.marker(latlng).addTo(map);
  $('pos').textContent = latlng.lat.toFixed(4) + ', ' + latlng.lng.toFixed(4);
  $('go').disabled = false;
}
function say(t, err) { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }

map.on('click', e => setStart(e.latlng));
$('km').oninput = () => $('kmv').textContent = $('km').value + ' km';
$('buf').oninput = () => $('bufv').textContent = $('buf').value + ' km';

$('gps').onclick = () => {
  if (!navigator.geolocation) return say('Dieses Gerät kann keinen Standort liefern. Tippe auf die Karte.', true);
  say('Suche Standort …');
  navigator.geolocation.getCurrentPosition(p => {
    const ll = L.latLng(p.coords.latitude, p.coords.longitude);
    setStart(ll); map.setView(ll, 9); say('');
  }, () => say('Standort verweigert. Tippe stattdessen auf die Karte.', true));
};

const stations = L.layerGroup().addTo(map);
let items = [], active = new Set();

function applyFilter() {
  stations.clearLayers();
  items.forEach(i => { if (!active.size || active.has(i.op)) i.marker.addTo(stations); });
  document.querySelectorAll('#chips button').forEach(b => b.classList.toggle('on', active.has(b.dataset.op)));
}
function renderChips() {
  const box = $('chips'); box.innerHTML = '';
  const counts = {};
  items.forEach(i => counts[i.op] = (counts[i.op] || 0) + 1);
  const ops = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  box.hidden = ops.length < 2;
  ops.forEach(op => {
    const b = document.createElement('button');
    b.dataset.op = op; b.textContent = op + ' ' + counts[op];
    b.onclick = () => { active.has(op) ? active.delete(op) : active.add(op); applyFilter(); };
    box.appendChild(b);
  });
  applyFilter();
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function edgeDist(pt, geom) {
  const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
  const k = Math.cos(pt[1] * Math.PI / 180) * 111320;
  let best = Infinity;
  for (const p of polys) for (const ring of p)
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const ax = (ring[j][0] - pt[0]) * k, ay = (ring[j][1] - pt[1]) * 110540;
      const dx = (ring[i][0] - pt[0]) * k - ax, dy = (ring[i][1] - pt[1]) * 110540 - ay;
      const l = dx * dx + dy * dy;
      const t = l ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l)) : 0;
      best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
    }
  return best;
}

async function showStations(feature) {
  stations.clearLayers(); items = []; active.clear(); $('chips').hidden = true;
  if (!$('chg').checked) return '';
  try {
    const b = L.geoJSON(feature).getBounds();
    const bb = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].join(',');
    const q = '[out:json][timeout:25];nwr["amenity"="charging_station"]["socket:type2_combo"](' + bb + ');out center tags;';
    const r = await fetch('https://overpass-api.de/api/interpreter', {
      method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' }, body:'data=' + encodeURIComponent(q)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    let n = 0;
    d.elements.forEach(e => {
      const lat = e.lat ?? (e.center && e.center.lat), lng = e.lon ?? (e.center && e.center.lon);
      if (lat == null) return;
      const pt = [lng, lat];
      if (!inPoly(pt, feature.geometry) || edgeDist(pt, feature.geometry) > 10000) return;
      const t = e.tags || {};
      const op = t.operator || t.brand || t.name || 'Unbekannt';
      const marker = L.circleMarker([lat, lng], { radius:7, color:'#fff', weight:2, fillColor:'#1b1f24', fillOpacity:1 })
        .bindPopup('<b>' + esc(op) + '</b>' + (t.capacity ? '<br>' + esc(t.capacity) + ' Ladepunkte' : '')
          + '<br><a class="nav" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='
          + lat + ',' + lng + '&travelmode=driving">Navigation starten</a>');
      items.push({ op, marker });
      n++;
    });
    renderChips();
    return n ? n + ' Schnelllader am Rand.' : 'Keine Schnelllader am Rand gefunden.';
  } catch (e) {
    return 'Ladestationen konnten nicht geladen werden (' + e.message + ').';
  }
}

let destMarker = null;
function inRing(pt, ring) {
  let c = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function inPoly(pt, geom) {
  const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
  return polys.some(p => inRing(pt, p[0]) && !p.slice(1).some(h => inRing(pt, h)));
}
async function checkDest(key, feature) {
  if (destMarker) { destMarker.remove(); destMarker = null; }
  $('dest').className = '';
  const q = $('dest').value.trim();
  if (!q) return '';
  const r = await fetch('https://api.openrouteservice.org/geocode/search?size=1&text=' + encodeURIComponent(q), { headers:{ 'Authorization':key } });
  const g = await r.json();
  if (!r.ok || !g.features || !g.features.length) return 'Ziel nicht gefunden.';
  const [lng, lat] = g.features[0].geometry.coordinates;
  const ok = inPoly([lng, lat], feature.geometry);
  destMarker = L.circleMarker([lat, lng], { radius:9, color:'#fff', weight:2, fillColor: ok ? '#2e9e5b' : '#d6452f', fillOpacity:1 }).addTo(map);
  $('dest').className = ok ? 'ok' : 'bad';
  return ok ? 'Ziel liegt in der Wolke.' : 'Ziel liegt außerhalb der Wolke.';
}

$('go').onclick = async () => {
  const key = $('key').value.trim();
  if (!key) { $('keybox').open = true; return say('Ohne API-Schlüssel keine Wolke.', true); }
  try { localStorage.setItem('ors_key', key); } catch(e) {}

  let km = parseFloat($('km').value);
  if (!(km > 0)) return say('Gib eine Restreichweite über 0 km ein.', true);
  if (km > 120) return say('DistCloud rechnet bis höchstens 120 km. Gib einen kleineren Wert ein.', true);
  let buf = parseFloat($('buf').value) || 0;
  if ($('ret').checked) { km /= 2; buf /= 2; }
  const safe = Math.round(Math.max(0, km - buf) * 1000);
  const full = Math.round(km * 1000);
  const ranges = safe > 0 && safe < full ? [safe, full] : [full];

  $('go').disabled = true; say('Rechne …');
  try {
    const r = await fetch('https://api.openrouteservice.org/v2/isochrones/driving-car', {
      method:'POST',
      headers:{ 'Authorization':key, 'Content-Type':'application/json' },
      body: JSON.stringify({ locations:[[start.lng, start.lat]], range:ranges, range_type:'distance', units:'m' })
    });
    const data = await r.json();
    if (!r.ok) throw new Error((data.error && (data.error.message || data.error)) || ('HTTP ' + r.status));

    if (cloud) cloud.remove();
    cloud = L.geoJSON(data, {
      style: f => f.properties.value === safe && ranges.length > 1
        ? { color:'#2e9e5b', weight:2, fillColor:'#2e9e5b', fillOpacity:.35 }
        : { color:'#2e9e5b', weight:1, dashArray:'4', fillColor:'#2e9e5b', fillOpacity:.12 }
    }).addTo(map);
    const inner = data.features.find(f => f.properties.value === ranges[0]) || data.features[0];
    const destMsg = await checkDest(key, inner);
    const outer = data.features.find(f => f.properties.value === ranges[ranges.length - 1]) || data.features[data.features.length - 1];
    const chgMsg = await showStations(outer);
    const b = cloud.getBounds();
    if (destMarker) b.extend(destMarker.getLatLng());
    map.fitBounds(b, { paddingTopLeft:[window.innerWidth > 700 ? 240 : 0, 100], paddingBottomRight:[0, 140] });
    say((ranges.length > 1 ? 'Dunkel: sicher erreichbar. Gestrichelt: theoretisch erreichbar.' : 'Fertig. Das ist deine Wolke.') + ' ' + destMsg + ' ' + chgMsg);
  } catch (e) {
    say('Fehler: ' + e.message + '. Prüfe Schlüssel und Entfernung, ORS begrenzt die maximale Strecke pro Anfrage.', true);
  } finally { $('go').disabled = false; }
};
</script>
</body>
</html>
